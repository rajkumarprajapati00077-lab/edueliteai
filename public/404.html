<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>EduEliteAI</title>
    <script>
      // Single Page Apps for GitHub Pages (spa-github-pages)
      // Redirects deep links (e.g. /dashboard) back to index.html so the
      // React router can take over. Works with a custom domain at root.
      (function () {
        var pathSegmentsToKeep = 0;
        var l = window.location;
        l.replace(
          l.protocol +
            "//" +
            l.hostname +
            (l.port ? ":" + l.port : "") +
            l.pathname
              .split("/")
              .slice(0, 1 + pathSegmentsToKeep)
              .join("/") +
            "/?/" +
            l.pathname
              .slice(1)
              .split("/")
              .slice(pathSegmentsToKeep)
              .join("/")
              .replace(/&/g, "~and~") +
            (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
            l.hash
        );
      })();
    </script>
  </head>
  <body></body>
</html>
